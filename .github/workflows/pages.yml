name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove stale github-pages artifacts from earlier runs
        # deploy-pages looks up the artifact by name; leftover duplicates
        # from previous runs make the lookup fail. Delete them first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            | python3 -c "
          import json, sys
          for a in json.load(sys.stdin).get('artifacts', []):
              if a['name'] == 'github-pages':
                  print(a['id'])
          " | while read -r id; do
              echo "Deleting stale artifact $id"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Debug: list artifacts with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?run_id=$GITHUB_RUN_ID&per_page=100")
          echo "$OUT" > /tmp/arts.json
          echo "::group::raw artifact list"
          echo "$OUT" | head -c 3000
          echo "::endgroup::"
          echo "::notice::DEBUG artifact-list for run $GITHUB_RUN_ID: $(echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print([(a['id'],a['name'],a['size_in_bytes'],a['created_at']) for a in d.get('artifacts',[])]) or d.get('message')")"
          if echo "$OUT" | grep -q '"artifacts": \[\]'; then
            echo "::warning::DEBUG: token sees NO artifacts for this run (metadata backend issue?)"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
